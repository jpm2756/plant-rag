[project]
name = "plant-rag"
version = "0.1.0"
description = "Hybrid RAG + agent assistant over the USDA PLANTS database"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dlt[postgres]==1.5.0",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "streamlit==1.41.1",
    "openai==1.59.6",
    "qdrant-client==1.12.2",
    "fastembed==0.5.1",
    "psycopg[binary]==3.2.3",
    "sqlalchemy==2.0.36",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "requests==2.32.3",
    "tenacity==9.0.0",
    "pypdf==5.1.0",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "tqdm==4.67.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.9.2",
    "pytest==8.3.4",
    "jupyter==1.1.1",
    "matplotlib==3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingestion", "eval_suite"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
